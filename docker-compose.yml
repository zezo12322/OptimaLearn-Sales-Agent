services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sales_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs to completion before the API and worker start, so neither ever talks to
  # a schema that has not been created yet.
  migrate:
    build: .
    env_file: .env
    environment: &db_env
      DATABASE_URL: postgresql+asyncpg://sales:sales@postgres:5432/sales_agent
      SYNC_DATABASE_URL: postgresql+psycopg2://sales:sales@postgres:5432/sales_agent
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run alembic upgrade head

  api:
    build: .
    env_file: .env
    environment: *db_env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file: .env
    environment: *db_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    command: uv run celery -A app.worker.celery_app worker --loglevel=info

  # Separate container, and there must be exactly one: two beats would double
  # every scheduled send.
  beat:
    build: .
    env_file: .env
    environment: *db_env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    command: uv run celery -A app.worker.celery_app beat --loglevel=info

volumes:
  pgdata:
