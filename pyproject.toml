[project]
name = "optimalearn-sales-agent"
version = "1.0.0"
description = "AI sales agent for OptimaLearn: WhatsApp + Messenger inbound qualification, compliant outbound cadences, in-product upsell."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.138.1",
    "httpx>=0.28.1",
    "openai>=2.44.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.13.0",
    "tzdata>=2025.1",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
# E501: long Arabic literals in the seed data and prompts are not worth wrapping
#   mid-sentence.
# B008: FastAPI's Depends()/Query() defaults are the framework's idiom.
# UP007/UP045/UP017: house style across the team's Python services is
#   Optional[X] and timezone.utc, and matching it matters more than the newer
#   spelling.
ignore = ["E501", "B008", "UP007", "UP045", "UP017"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated-style code with a fixed shape.
"alembic/versions/*" = ["I001"]
